name: CI

on:
  push:
    branches: [main, "pre/**"]
  pull_request:
  workflow_call: # the release workflow runs this first

permissions:
  contents: read

# A newer push to a branch supersedes the older run; a release (tag) run is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Plugin version is the same everywhere
        run: bash scripts/check-version.sh
      - name: Newest Jellyfin 12.x on NuGet
        id: latest
        run: |
          version="$(curl -fsS https://api.nuget.org/v3-flatcontainer/jellyfin.controller/index.json \
            | jq -r '[.versions[] | select(test("^12\\.[0-9]+\\.[0-9]+$"))] | last')"
          [[ "$version" == 12.* ]] || { echo "No Jellyfin 12.x on NuGet?" >&2; exit 1; }
          echo "Newest 12.x: $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  test:
    name: Test (Jellyfin ${{ matrix.jellyfin }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 12.0.0 is what the plugin is built against (targetAbi 12.0.0.0), 12.1.0 what the
        # production server runs, and "latest" catches API drift in newer 12.x releases.
        jellyfin: ["12.0.0", "12.1.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: |
          version="${{ matrix.jellyfin }}"
          [[ "$version" == latest ]] && version="${{ needs.versions.outputs.latest }}"
          echo "Testing against Jellyfin $version"
          dotnet test -c Release -p:JellyfinVersion="$version"

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the plugin zip
        id: build
        run: |
          pip install jprm==1.1.0
          mkdir -p artifacts  # jprm does not create it
          zip="$(jprm --verbosity=info plugin build . -o "$PWD/artifacts")"
          echo "Built $zip"
          unzip -l "$zip"
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kasumeta-plugin
          path: artifacts/*
          if-no-files-found: error
