openapi: 3.0.3
info:
  title: KasuMeta
  version: "1"
  description: |
    Localized metadata for Jellyfin client apps, served by the KasuMeta plugin (Jellyfin 12.x).

    - **Auth:** Jellyfin's own. Send the header the client already sends:
      `Authorization: MediaBrowser Client="…", Device="…", DeviceId="…", Version="…", Token="…"`.
      No token → 401.
    - **Casing:** PascalCase, as Jellyfin serializes everything. Request bodies bind
      case-insensitively.
    - **Absent, not null:** Jellyfin omits null properties. A field KasuMeta has nothing for is
      simply not in the object.
    - **Ids:** Jellyfin item GUIDs. Responses use the dashless form `BaseItemDto.Id` uses;
      requests accept either form.
    - **Locales:** BCP-47 with a hyphen (`es-MX`). `es_MX` and other casings are accepted and
      normalized.
    - **Fallback, per field and per image type:** exact locale, then the bare language (`es`), then another region
      of the same language in the server's enabled-locales order (`es-ES`), when the server
      has `FallbackToBaseLanguage` on. Scripts never stand in for each other: Traditional and
      Simplified Chinese stay apart, and so do romanized titles (`ja-Latn`, romaji) and
      Japanese-script ones (`ja-JP`). `ResolvedLocale` says which one was served.
    - **Original language:** when nothing resolves in the requested language, a field (or image
      type) is served in the item's original language (a Japanese series' Japanese synopsis), if
      the server has `FallbackToOriginalLanguage` on, even when `FallbackToBaseLanguage` is off.
      With nothing in any of them the field is absent.
    - **Sources:** the admin picks, per category (titles, overviews, taglines, genres, tags, each
      image type), which providers (TMDB, TVDB, AniList) it comes from and in what order: for each
      locale the first one with a value wins and the next ones fill what it lacks, so a title TVDB
      lacks in Spanish comes from TMDB. For movies and series with an AniList id, AniList also
      brings romaji as `ja-Latn` (`zh-Latn`, `ko-Latn` for Chinese and Korean titles). Romaji is
      stored even when `ja-Latn` isn't among the enabled locales, so Search finds an anime by its
      romaji name from any locale; it's served only when `ja-Latn` itself is asked for. A manual
      value beats them all.
    - **Genres and tags:** lists of terms. TMDB names its genres in many languages; every other
      provider term is English, and the admin's dictionary (`Terms`) translates those at serve
      time (`Source: dictionary`; terms it lacks stay in English).
    - **Images:** localized art from the providers (posters as `Primary`, `Logo`, `Backdrop`),
      chosen per locale: raster before SVG, then by votes. `Url` is the original file; TMDB serves
      smaller copies at the same path with `/original/` replaced by `/w342/`, `/w500/` or `/w780/`
      (logos: `/w300/`, `/w500/`), with `Access-Control-Allow-Origin: *`. Textless art isn't
      localized, so it's left to Jellyfin's own images. An image an admin uploaded has
      `Uploaded: true` and a `Url` relative to the server's base URL, fetched with the client's
      Jellyfin token.
    - **Search:** over localized names in every stored locale, so a title is found by its name
      in any enabled language. Case and accents are ignored ("cabana" finds "La cabaña del
      terror"), every word must match, the last word matches as a prefix (type-ahead), and text
      in scripts written without spaces (Chinese, Japanese, Korean, Thai) matches anywhere in a
      name. On a server whose SQLite lacks FTS5 every word matches as a plain substring
      instead, without accent folding.
    - **Growing without breaking:** new routes and optional properties are added under the same
      `ApiVersion`; `Info.Features` says what a given build has.
    - **Visibility:** items the caller can't see are reported exactly like items with no data
      (`Missing` / 404), so the API never reveals hidden titles.
    - **Overrides (admins):** `Items/{itemId}/All`, `PUT Items/{itemId}/{locale}` and
      `Items/{itemId}/Refresh` need an administrator's token or an API key (Jellyfin's
      `RequiresElevation` policy); anyone else gets 403. A manual value has `Source` `manual`.
      When it's `Locked`, provider refreshes never replace it. It's served through the read
      routes and found by search like any other value.
    - **Examples:** `api/fixtures/*.json` were captured from a live Jellyfin 12.1 server and are
      checked by the plugin's tests; client tests can use the same files.
servers:
  - url: http://localhost:8097
    description: KasuMeta dev server (docker/dev/compose.yaml)
security:
  - MediaBrowser: []
paths:
  /KasuMeta/Info:
    get:
      summary: Capability check
      description: >
        Called after sign-in. 200 means the plugin is installed; 404 means it isn't, and the client
        keeps to stock Jellyfin fields. A client refuses an ApiVersion it doesn't know, and checks
        Features before calling a route an older build may lack.
      responses:
        "200":
          description: Installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasuMetaInfo" }
              example: { $ref: "fixtures/info.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /KasuMeta/Items/Batch:
    post:
      summary: Localized overlays (text and images) for many items (one call per grid page)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
            example:
              ItemIds: ["1eb732044aec1079626f8d928d40e1bc", "ff39210272a627bfdd396d3f7c57c2a8", "0fb78f59088fbebaaa7ec9cfb39e3e6f"]
              Locale: es_mx
      responses:
        "200":
          description: Overlays for items that have one; every other requested id is in Missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
              example: { $ref: "fixtures/batch.json" }
        "400":
          description: Bad locale, unknown field or image type, or more than 200 ids. The body is a message string.
          content:
            application/json:
              schema: { type: string }
              example: "Unknown field 'Rating'. Known: genres, name, overview, sort_name, tagline, tags."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: A request with neither a user nor an API key.
  /KasuMeta/Items/{itemId}:
    get:
      summary: Full localized overlay of one item (detail page)
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: locale
          in: query
          required: true
          schema: { type: string, example: es-ES }
      responses:
        "200":
          description: The overlay.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemOverlay" }
              example: { $ref: "fixtures/item.json" }
        "400":
          description: Bad locale.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Nothing to serve. The item isn't fetched yet, has no translation in any fallback locale, is unknown, or isn't visible to the caller.
  /KasuMeta/Status:
    get:
      summary: "Admin: how the plugin is doing"
      description: >
        Configuration health, fetch progress (queue length, items per outcome), the newest failed
        fetches with the items' library names, and each provider's counters since the server
        started. The plugin's configuration page shows it.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KasuMetaStatus" }
              example: { $ref: "fixtures/status.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
  /KasuMeta/Items/{itemId}/All:
    get:
      summary: "Admin: every stored locale of one item"
      description: >
        What a translations editor loads. Every stored locale as stored, with no fallback, so each
        value's `ResolvedLocale` is its own key. Includes each value's `Source` and `Locked`, and the
        item's fetch state.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "200":
          description: The stored values. `Locales` is empty when nothing is stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTranslations" }
              example: { $ref: "fixtures/translations.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404":
          description: No such item in the library.
  /KasuMeta/Items/{itemId}/{locale}:
    put:
      summary: "Admin: set or remove manual values of one item in one locale"
      description: >
        Only the keys present are touched, in one transaction. A value always replaces what is
        stored, locked or not, as a `manual` value. `null` removes the stored value for this locale,
        manual or not, and queues a re-fetch, so the provider's value comes back shortly if it has
        one. The response is the item's admin view after the change, before any re-fetch. Evict
        the client's cached overlay for the item afterwards.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
        - name: locale
          in: path
          required: true
          description: BCP-47; any valid locale, not only the enabled ones.
          schema: { type: string, example: es-MX }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemOverridesRequest" }
            example:
              Fields:
                Name: { Value: "El viaje de Chihiro" }
                Tagline: { Value: "Corrección rápida", Locked: false }
                Overview: null
                Genres: { Values: ["Animación", "Fantasía"] }
              Images:
                Logo: null
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTranslations" }
        "400":
          description: >
            Bad locale, unknown key, a key given twice (`SortName` and `sort_name`), empty text,
            text over 10,000 characters, a genre or tag list that is empty, has over 100 terms or
            a term over 200 characters, an image URL that isn't absolute http(s) or is over 2,048
            characters, or nothing to change. The body is a message string.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404":
          description: No such item in the library.
  /KasuMeta/Items/{itemId}/{locale}/Images/{imageType}:
    parameters:
      - { $ref: "#/components/parameters/ItemId" }
      - name: locale
        in: path
        required: true
        schema: { type: string, example: es-MX }
      - name: imageType
        in: path
        required: true
        description: Any casing.
        schema: { type: string, enum: [Primary, Logo, Backdrop, Thumb] }
    put:
      summary: "Admin: upload an image file for one item, locale and type"
      description: >
        Stores the file as the item's manual image for that locale and type, replacing the stored
        one (provider, URL or earlier upload). To use a URL instead (the provider's or another), or
        to remove the image, use `PUT Items/{itemId}/{locale}`. The format is checked by the file's
        content: JPEG, PNG, WebP or GIF; SVG is refused. Width and Height are read from the file.
        The response is the item's admin view after the change.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: At most 10 MiB (10,485,760 bytes).
                locked:
                  type: boolean
                  default: true
                  description: Whether provider refreshes must leave the image alone.
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemTranslations" }
        "400":
          description: Bad locale or image type, a malformed form, no `file` part, or not a JPEG, PNG, WebP or GIF. The body is a message string.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404":
          description: No such item in the library.
        "413":
          description: The file is larger than 10 MiB.
    get:
      summary: An uploaded image file
      description: >
        What an overlay's `Url` points at when `Uploaded` is true, for anyone who may see the item.
        The `v` query parameter overlays add only changes when the file does, so the response may
        be cached; it carries an `ETag` and answers `If-None-Match` with 304.
      responses:
        "200":
          description: The file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "304":
          description: Unchanged since the ETag sent.
        "400":
          description: Bad locale or image type.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No uploaded file for that item, locale and type, or the item isn't visible to the caller.
  /KasuMeta/Terms:
    get:
      summary: "Admin: the genre or tag dictionary for one locale"
      description: >
        Every term the library's items carry in English, and every term the dictionary holds, with
        its translation in the locale (absent if none) and how many items carry it. Untranslated
        terms come first.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [genre, tag] }
        - name: locale
          in: query
          required: true
          schema: { type: string, example: es-MX }
      responses:
        "200":
          description: The terms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermList" }
              example: { $ref: "fixtures/terms.json" }
        "400":
          description: Unknown kind or bad locale.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
  /KasuMeta/Terms/{kind}/{locale}:
    put:
      summary: "Admin: set or remove dictionary translations"
      description: >
        In one transaction. Overlays use the change at once, without a re-fetch. The response is
        the kind's terms for the locale after the change.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [genre, tag] }
        - name: locale
          in: path
          required: true
          schema: { type: string, example: es-MX }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermsRequest" }
            example:
              Translations:
                Action: Acción
                Mahou Shoujo: Chicas mágicas
                Horror: null
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermList" }
        "400":
          description: Unknown kind, bad locale, nothing to change, a term given twice, or a term or translation that is empty or over 200 characters.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
  /KasuMeta/Items/{itemId}/Refresh:
    post:
      summary: "Admin: re-fetch one item from its providers"
      description: >
        Queues a forced fetch. Locked values stay. The fetch is done when `Fetch.LastFetch` in
        `Items/{itemId}/All` is newer than the request.
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "202":
          description: Queued.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404":
          description: No such item in the library.
  /KasuMeta/Search:
    get:
      summary: Find items by their localized names
      description: >
        Returns ids, not items: the client fetches them from Jellyfin (`/Items?ids=`) and merges
        them into its own search results. One result per item; when an item's name matches in
        several locales, the caller's locale is the one reported. Order: exact name matches, then
        names starting with the query, then the rest; the caller's locale before its language's
        other regions before other languages; then relevance.
      parameters:
        - name: q
          in: query
          required: true
          description: What the user typed. Needs at least one letter or digit; at most 200 characters and 12 words are used.
          schema: { type: string, example: cabana del terr }
        - name: locale
          in: query
          required: true
          schema: { type: string, example: es-MX }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: types
          in: query
          description: Comma-separated item kinds, any casing. Default is Movie,Series,Episode.
          schema: { type: string, example: "Movie,Series" }
      responses:
        "200":
          description: The matches the caller may see, best first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
              example: { $ref: "fixtures/search.json" }
        "400":
          description: No searchable text in q, bad locale, limit out of range, or an unknown type. The body is a message string.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: A request with neither a user nor an API key.
components:
  securitySchemes:
    MediaBrowser:
      type: apiKey
      in: header
      name: Authorization
      description: 'MediaBrowser Client="…", Device="…", DeviceId="…", Version="…", Token="<access token>"'
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: No or invalid Jellyfin token.
    NotAdmin:
      description: The token belongs to a user who isn't an administrator.
  schemas:
    KasuMetaInfo:
      type: object
      required: [Name, Version, ApiVersion, EnabledLocales, FallbackToBaseLanguage, Features]
      properties:
        Name: { type: string, example: KasuMeta }
        Version: { type: string, example: 1.0.0.0 }
        ApiVersion: { type: integer, example: 1 }
        EnabledLocales:
          type: array
          items: { type: string }
          example: [en-US, es-ES, es-MX, ja-JP, zh-CN]
        FallbackToBaseLanguage: { type: boolean }
        FallbackToOriginalLanguage:
          type: boolean
          description: Whether a field with nothing in the requested language is served in the item's original language.
        Features:
          type: array
          description: What this build serves. Unknown values are to be ignored.
          items:
            type: string
            enum: [text, images, search, overrides, genres, tags, uploads, terms, original-language]
    BatchRequest:
      type: object
      required: [ItemIds, Locale]
      properties:
        ItemIds:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
        Locale: { type: string, example: es-MX }
        Fields:
          type: array
          description: >
            Which fields to return. Absent means all; an empty list means none (an images-only
            request). Any casing; `SortName` and `sort_name` both work.
          items:
            type: string
            enum: [name, overview, tagline, sort_name, genres, tags]
        Images:
          type: array
          description: >
            Which image types to return. Absent means all; an empty list means none (a text-only
            request). Any casing.
          items:
            type: string
            enum: [Primary, Logo, Backdrop, Thumb]
    BatchResponse:
      type: object
      required: [Locale, Items, Missing]
      properties:
        Locale:
          type: string
          description: The requested locale, normalized.
        Items:
          type: object
          description: Overlays keyed by dashless item id.
          additionalProperties: { $ref: "#/components/schemas/ItemOverlay" }
        Missing:
          type: array
          description: Requested ids with nothing to serve (see 404 above). Show stock Jellyfin fields for these.
          items: { type: string }
    ItemOverlay:
      type: object
      required: [UpdatedAt]
      description: At least one localized field or image is present.
      properties:
        Name: { $ref: "#/components/schemas/LocalizedValue" }
        Overview: { $ref: "#/components/schemas/LocalizedValue" }
        Tagline: { $ref: "#/components/schemas/LocalizedValue" }
        SortName: { $ref: "#/components/schemas/LocalizedValue" }
        Genres: { $ref: "#/components/schemas/LocalizedList" }
        Tags: { $ref: "#/components/schemas/LocalizedList" }
        Images:
          type: object
          description: Localized images keyed by Jellyfin image type; absent when there are none.
          additionalProperties: { $ref: "#/components/schemas/LocalizedImageValue" }
        UpdatedAt:
          type: string
          format: date-time
          description: When the newest value served here was written.
    LocalizedValue:
      type: object
      required: [Value, Source, ResolvedLocale, Locked]
      properties:
        Value: { type: string }
        Source:
          type: string
          enum: [tmdb, tvdb, anilist, manual]
        ResolvedLocale:
          type: string
          description: The stored locale served; differs from the request after a fallback.
        Locked:
          type: boolean
          description: An admin override that provider refreshes never replace.
    LocalizedList:
      type: object
      required: [Values, Source, ResolvedLocale, Locked]
      properties:
        Values:
          type: array
          items: { type: string }
          example: [Acción, Drama]
        Source:
          type: string
          enum: [tmdb, tvdb, anilist, manual, dictionary]
          description: >
            `dictionary`: the admin's dictionary translated some of the terms: the providers'
            English list, or English names a provider left in a localized list (TMDB keeps
            "Sci-Fi & Fantasy" in Spanish). Terms it lacks stay as they were.
        ResolvedLocale:
          type: string
          description: The stored locale served; differs from the request after a fallback.
        Locked:
          type: boolean
    LocalizedImageValue:
      type: object
      required: [Url, Source, ResolvedLocale, Locked, Uploaded]
      properties:
        Url:
          type: string
          description: >
            Absolute URL of the original file; for an uploaded file (`Uploaded`), the path of
            KasuMeta's image route relative to the server's base URL, with no leading slash.
          example: https://image.tmdb.org/t/p/original/iLIe4sykUb0NxZpSKcHZmaqbgoy.jpg
        Uploaded:
          type: boolean
          description: A file an admin uploaded, served by KasuMeta (send the Jellyfin token).
        Width: { type: integer, description: "Pixel width of the original, when known." }
        Height: { type: integer, description: "Pixel height of the original, when known." }
        Source:
          type: string
          enum: [tmdb, tvdb, anilist, manual]
        ResolvedLocale:
          type: string
          description: The stored locale served; differs from the request after a fallback.
        Locked:
          type: boolean

    KasuMetaStatus:
      type: object
      required: [Version, SchemaVersion, SearchIndex, TmdbConfigured, TvdbConfigured, MetadataProviders, AniListEnabled, Sources, Queued, Items, RecentErrors, Providers]
      properties:
        Version: { type: string }
        SchemaVersion: { type: integer }
        SearchIndex:
          type: boolean
          description: False when the server's SQLite lacks FTS5 and search matches substrings instead.
        TmdbConfigured: { type: boolean }
        TvdbConfigured: { type: boolean }
        MetadataProviders:
          type: array
          description: The keyed providers queried (some category lists them and their key is set), usual first choice first. Empty when neither is.
          items:
            type: string
            enum: [tmdb, tvdb]
        AniListEnabled:
          type: boolean
          description: Whether some category lists AniList.
        Sources:
          type: object
          description: >
            Per category (`name`, `overview`, `tagline`, `genres`, `tags`, `image:Primary`,
            `image:Logo`, `image:Backdrop`, `image:Thumb`), the providers its values come from,
            first choice first, leaving out providers that aren't set up.
          additionalProperties:
            type: array
            items: { type: string, enum: [tmdb, tvdb, anilist] }
        Queued:
          type: integer
          description: Items waiting to be fetched; a backfill's progress.
        Items: { $ref: "#/components/schemas/ItemCounts" }
        RecentErrors:
          type: array
          description: The newest failed fetches (at most 10), newest first.
          items: { $ref: "#/components/schemas/FetchProblem" }
        Providers:
          type: object
          description: Counters per provider (tmdb, tvdb, anilist) since the server started; a provider not used yet is absent.
          additionalProperties: { $ref: "#/components/schemas/ProviderCounters" }
    ItemCounts:
      type: object
      required: [Total, Ok, Skipped, Error, Pending]
      properties:
        Total: { type: integer }
        Ok: { type: integer }
        Skipped:
          type: integer
          description: Nothing to fetch (no provider id, or unknown to the provider).
        Error:
          type: integer
          description: The last fetch failed; retried by the "Refresh stale translations" task.
        Pending:
          type: integer
          description: Queued once and never finished (e.g. a restart mid-fetch).
    FetchProblem:
      type: object
      required: [ItemId]
      properties:
        ItemId: { type: string }
        Name:
          type: string
          description: The item's name in the library; absent if it's gone.
        Type:
          type: string
          enum: [Movie, Series, Season, Episode]
        Error: { type: string }
        LastFetch: { type: string, format: date-time }
    ProviderCounters:
      type: object
      required: [Requests, Retries, NotFound, Failures]
      properties:
        Requests:
          type: integer
          description: HTTP requests sent, retries included.
        Retries: { type: integer }
        NotFound:
          type: integer
          description: Lookups answered with 404.
        Failures:
          type: integer
          description: Lookups that failed for good, including "no key configured".
        LastFailure:
          type: string
          description: The last failure's message; never contains a key.
        LastFailureAt: { type: string, format: date-time }
    ItemTranslations:
      type: object
      required: [ItemId, Locales]
      properties:
        ItemId:
          type: string
          description: Dashless Jellyfin item id.
        Locales:
          type: object
          description: Stored values keyed by locale, without fallback; empty when nothing is stored.
          additionalProperties: { $ref: "#/components/schemas/ItemOverlay" }
        Fetch: { $ref: "#/components/schemas/ItemFetchInfo" }
        OriginalLanguage:
          type: string
          description: The item's original language (`ja`), the last-resort fallback; absent if unknown.
    ItemFetchInfo:
      type: object
      description: The item's last provider fetch; absent if the item was never queued.
      required: [Status]
      properties:
        Status:
          type: string
          enum: [pending, ok, error, skipped]
          description: "`skipped`: nothing to fetch, e.g. no TMDB id."
        LastFetch: { type: string, format: date-time }
        LastError:
          type: string
          description: Why the last fetch failed or was skipped.
    ItemOverridesRequest:
      type: object
      description: At least one entry in Fields or Images.
      properties:
        Fields:
          type: object
          description: >
            Keyed by field (Name, Overview, Tagline, SortName, Genres, Tags; any casing,
            `sort_name` too). `null` removes the stored value.
          additionalProperties:
            nullable: true
            allOf: [{ $ref: "#/components/schemas/ManualFieldValue" }]
        Images:
          type: object
          description: Keyed by image type (Primary, Logo, Backdrop, Thumb; any casing). `null` removes the stored image.
          additionalProperties:
            nullable: true
            allOf: [{ $ref: "#/components/schemas/ManualImageValue" }]
    ManualFieldValue:
      type: object
      description: Value for text fields, Values for Genres and Tags.
      properties:
        Value:
          type: string
          maxLength: 10000
          description: Trimmed; must not be empty.
        Values:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
          description: Genres or tags, in order; each trimmed, empty ones and repeats (ignoring case) dropped. At least one must remain.
        Locked:
          type: boolean
          default: true
          description: False sets a quick correction that the next provider fetch may replace.
    ManualImageValue:
      type: object
      required: [Url]
      properties:
        Url:
          type: string
          format: uri
          maxLength: 2048
          description: >
            Absolute http(s) URL. Only `image.tmdb.org` URLs can be resized by swapping
            `/original/`; serve other hosts as they are. Width and Height are not known for manual
            images. To store a file instead, upload it with `PUT Items/{itemId}/{locale}/Images/{imageType}`.
        Locked:
          type: boolean
          default: true

    TermList:
      type: object
      required: [Kind, Locale, Terms]
      properties:
        Kind: { type: string, enum: [genre, tag] }
        Locale: { type: string }
        Terms:
          type: array
          description: Untranslated terms first, then by how many items carry them.
          items: { $ref: "#/components/schemas/TermEntry" }
    TermEntry:
      type: object
      required: [Term, Items]
      properties:
        Term:
          type: string
          description: The providers' (English) term.
        Translation:
          type: string
          description: Its translation in the list's locale; absent if none.
        Items:
          type: integer
          description: How many items carry the term; 0 when only the dictionary has it.
    TermsRequest:
      type: object
      required: [Translations]
      properties:
        Translations:
          type: object
          description: Keyed by term (any casing); a string sets its translation, `null` or an empty string removes it.
          additionalProperties:
            type: string
            nullable: true
            maxLength: 200

    SearchResponse:
      type: object
      required: [Query, Locale, Results]
      properties:
        Query:
          type: string
          description: The query as the server read it (trimmed).
        Locale:
          type: string
          description: The requested locale, normalized.
        Results:
          type: array
          items: { $ref: "#/components/schemas/SearchResult" }
    SearchResult:
      type: object
      required: [ItemId, Type, MatchedName, MatchedLocale]
      properties:
        ItemId:
          type: string
          description: Dashless Jellyfin item id.
        Type:
          type: string
          enum: [Movie, Series, Season, Episode]
        MatchedName:
          type: string
          description: The localized name that matched, in the caller's locale when the item matched there.
        MatchedLocale:
          type: string
