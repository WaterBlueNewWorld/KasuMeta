# Manifest for jprm (Jellyfin Plugin Repository Manager): `jprm plugin build .`
# The version must match Directory.Build.props; scripts/check-version.sh checks it, and the
# release workflow checks the tag against it. The changelog is what Jellyfin's plugin catalog
# shows for this version: rewrite it for every release.
name: "KasuMeta"
guid: "703b8e8e-7d16-40bd-8f92-87fad8b741ae"
version: "1.3.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "WaterBlueNewWorld"
overview: "Localized titles, overviews and artwork for other frontends (no effect on Jellyfin's stock UI)"
description: >
  Note: this plugin has no effect on Jellyfin's stock UI. It is made for other
  frontends to consume: the localized metadata is only served through its own
  /KasuMeta API, which a client app must call itself. Jellyfin's web client and
  official apps keep showing the library's own metadata.
  Stores localized metadata beside Jellyfin (its own SQLite file): titles,
  overviews, taglines, genres, tags and artwork per locale from TMDB, TVDB and
  AniList, chosen per field, with an original-language fallback, search by
  localized name, and admin overrides and image uploads. Requires Jellyfin 12.x
  and a TMDB or TVDB API key.
category: "Metadata"
artifacts:
  - "Jellyfin.Plugin.KasuMeta.dll"
changelog: >
  1.3.0: find items by a genre or tag as it is shown. A new route,
  GET /KasuMeta/Items/ByTerm, returns the items whose localized genres or tags
  hold a name ("Terror" for a Spanish reader, where Jellyfin's own genre is
  "Horror"), ignoring case and accents, so a frontend can lead from a genre or
  tag it draws to every item that shows it. No effect on Jellyfin's stock UI:
  for frontends using the KasuMeta API. No database change.
